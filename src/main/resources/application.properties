server.port=8080
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}

spring.application.name=fhir-exam-app

spring.datasource.url=jdbc:sqlite:./data/fhir_exam.db?busy_timeout=10000&journal_mode=WAL&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON; PRAGMA busy_timeout = 10000;

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.jackson.serialization.fail-on-empty-beans=false

spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

app.security.self-registration=${APP_SELF_REGISTRATION:false}
app.security.max-failed-attempts=${APP_MAX_FAILED_ATTEMPTS:5}
app.security.lock-duration-minutes=${APP_LOCK_DURATION_MINUTES:15}
app.security.cookie-secure=${APP_COOKIE_SECURE:false}
app.security.admin-user=${APP_ADMIN_USER:}
app.security.admin-password=${APP_ADMIN_PASSWORD:}

logging.config=classpath:logback.xml
logging.level.root=INFO
logging.level.com.fhir.examapp=DEBUG
logging.level.ca.uhn.fhir=WARN
