server:
  port: 8080

spring:
  application:
    name: fhir-exam-app

  datasource:
    url: jdbc:sqlite:./data/fhir_exam.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

logging:
  config: classpath:logback.xml
  level:
    root: INFO
    com.fhir.examapp: DEBUG
    ca.uhn.fhir: WARN
