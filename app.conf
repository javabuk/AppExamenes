# ===================================================================
# FHIR Cert Master - Configuración del Servidor (Windows 11)
# ===================================================================

# Puerto HTTP en el que se ejecutará la aplicación (por defecto: 8080)
# Puedes cambiarlo a cualquier puerto libre (ej: 8081, 8888, 9090)
PORT=8787

# Abrir automáticamente el navegador predeterminado al arrancar (true / false)
OPEN_BROWSER=true

# Memoria máxima asignada a la Máquina Virtual de Java (JVM)
# Ejemplos: 512m, 768m, 1024m, 2048m
JVM_MAX_MEMORY=1024m

# ===================================================================
# Seguridad, Autenticación y Bootstrap de Administrador (Multiusuario)
# ===================================================================

# Usuario administrador inicial (se crea automáticamente si no existe ningún ADMIN activo)
APP_ADMIN_USER=admin

# Contraseña inicial para el usuario administrador en el primer arranque (bootstrap).
# IMPORTANTE: Si se deja vacío (recomendado), el sistema generará una contraseña aleatoria
# de un solo uso, la mostrará UNA SOLA VEZ en logs/app.log al arrancar y obligará a cambiarla
# en el primer inicio de sesión (mustChangePassword=true). Nunca guardes contraseñas reales en Git.
APP_ADMIN_PASSWORD=

# Protección contra fuerza bruta: número máximo de intentos de login fallidos consecutivos
APP_MAX_FAILED_ATTEMPTS=5

# Duración del bloqueo temporal de cuenta tras superar APP_MAX_FAILED_ATTEMPTS (en minutos)
APP_LOCK_DURATION_MINUTES=15

# Marcar cookies de sesión (FHIR_SESSION) y CSRF (XSRF-TOKEN) como Secure (true sólo bajo HTTPS)
APP_COOKIE_SECURE=false

# Permitir auto-registro público de usuarios (false = solo un ADMIN puede crear cuentas)
APP_SELF_REGISTRATION=false
