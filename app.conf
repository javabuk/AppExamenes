# ===================================================================
# FHIR Cert Master - Configuración del Servidor (Windows 11)
# ===================================================================

# Puerto HTTP en el que se ejecutará la aplicación (por defecto: 8080)
# Puedes cambiarlo a cualquier puerto libre (ej: 8081, 8888, 9090)
PORT=8787

# Abrir automáticamente el navegador predeterminado al arrancar (true / false)
OPEN_BROWSER=true

# Memoria máxima asignada a la Máquina Virtual de Java (JVM)
# Ejemplos: 512m, 768m, 1024m, 2048m
JVM_MAX_MEMORY=1024m
